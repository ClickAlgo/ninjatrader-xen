<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account | NinjaTrader Xen</title>
    <link rel="canonical" href="https://ninja.clickalgo.com/account.html">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="XEN AI">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/"><span class="brand-product">XEN</span> <span>NinjaTrader</span></a>
        <nav class="nav-actions" aria-label="Account navigation">
            <a class="button primary" href="/workspace.html">Return to Xen</a>
            <button id="logoutButton" class="button" type="button">Sign out</button>
        </nav>
    </header>

    <main class="account-shell">
        <section class="account-card account-card-wide">
            <p class="eyebrow">Your account</p>
            <h1>NinjaTrader Xen</h1>
            <div id="accountMessage" class="form-message">Loading account…</div>
            <div id="accountData" class="account-data" hidden>
                <div><strong>Email:</strong> <span id="accountEmail"></span></div>
                <div><strong>Subscriber:</strong> <span id="subscriberId"></span></div>
            </div>

            <div id="creditData" class="dashboard-grid" hidden>
                <article class="metric-card">
                    <span>Available credit</span>
                    <strong id="creditBalance">£0.00</strong>
                </article>
                <article class="metric-card">
                    <span>Account access</span>
                    <strong id="entitlementStatus">Pay as you go</strong>
                    <small id="entitlementExpiry"></small>
                </article>
            </div>

            <section id="transactionsSection" hidden>
                <h2>Recent transactions</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsBody"></tbody>
                    </table>
                </div>
                <p id="noTransactions" class="form-message" hidden>No credit transactions yet.</p>
            </section>

            <div class="account-actions">
                <a class="button topup-button" href="/topup.html">Top up credit</a>
                <a class="button primary" href="/workspace.html">Launch Xen</a>
            </div>
        </section>
    </main>

    <script src="/js/account.js"></script>
</body>
</html>
