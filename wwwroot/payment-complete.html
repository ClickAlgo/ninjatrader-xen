<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment complete | NinjaTrader Xen</title>
    <link rel="canonical" href="https://ninja.clickalgo.com/payment-complete.html">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="XEN AI">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="payment-body">
    <header class="site-header">
        <a class="brand" href="/workspace.html">
            <span class="brand-product">XEN</span>
            <span>NinjaTrader</span>
        </a>
    </header>

    <main class="payment-shell">
        <section class="payment-card payment-result">
            <div class="payment-success-mark" aria-hidden="true">✓</div>
            <p class="eyebrow">PAYMENT RETURN</p>
            <h1>Payment received</h1>
            <p id="paymentStatus" class="payment-intro">
                Waiting for Stripe to confirm your credit…
            </p>
            <strong id="paymentBalance" class="payment-balance"></strong>
            <div class="payment-result-actions">
                <a class="button topup-button" href="/workspace.html">Return to workspace</a>
                <a class="button" href="/account.html">View account</a>
            </div>
        </section>
    </main>

    <script src="/js/payment-complete.js"></script>
</body>
</html>
