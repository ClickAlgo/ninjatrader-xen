<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | NinjaTrader Xen</title>
    <link rel="canonical" href="https://ninja.clickalgo.com/login.html">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="XEN AI">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/"><span class="brand-product">XEN</span> <span>NinjaTrader</span></a>
        <a class="button" href="/register.html">Create account</a>
    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Welcome back</p>
            <h1>Sign in to NinjaTrader Xen.</h1>
            <p id="verificationNotice" hidden>Your email is verified. You can now sign in.</p>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div id="formMessage" class="form-message" role="status"></div>
                <button class="button primary full-width" type="submit">Sign in</button>
            </form>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
